version: '3.8'

services:
  chore-tracker:
    container_name: chore-tracker
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Map to your Unraid appdata array
      - /mnt/user/appdata/chore-tracker:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Los_Angeles
      # Optional: Base URL of your Unraid server (for push notification linkbacks)
      # - APP_URL=http://192.168.1.100:3000
      # Optional: Pushover iOS Push Notifications
      # - PUSHOVER_APP_TOKEN=your_30_character_pushover_app_token
      # Optional: Automated Parent Email Reports & SMS via Gmail
      # - PARENT_EMAIL=parent@example.com
      # - GMAIL_USER=yourgmail@gmail.com
      # - GMAIL_APP_PASSWORD=your_16_character_app_password
      # - DAILY_REPORT_TIME=20:00
