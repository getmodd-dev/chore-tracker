<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with smooth squircle shape -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  
  <!-- Subtle decorative rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="24" />
  
  <!-- Star symbol with shadow -->
  <path d="M256 95 L297 198 L407 206 L323 279 L349 387 L256 329 L163 387 L189 279 L105 206 L215 198 Z" fill="url(#star)" filter="url(#shadow)" />
  
  <!-- Checkmark in center of star -->
  <path d="M220 260 L246 288 L296 230" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
