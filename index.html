<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ignore benign Vite HMR WebSocket connection errors in sandbox/cloud preview environments
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite') !== -1 ||
          msg.indexOf('ws:') !== -1 ||
          msg.indexOf('wss:') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          filename.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Chore Points Tracker</title>
    <meta name="description" content="iOS-optimized web app for Unraid server to track daily and total chore points, task streaks, family leaderboards, and custom rewards." />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChorePoints" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="Chore Points Tracker" />
    <meta property="og:description" content="iOS-optimized web app for Unraid server to track daily and total chore points, task streaks, family leaderboards, and custom rewards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white select-none">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
